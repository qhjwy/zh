<!doctype html>
<html lang="en" class="dictionary-document">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HSK</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-family=%22system-ui,sans-serif%22 font-weight=%22bold%22 font-size=%2260%22 fill=%22%23d35400%22>zh</text></svg>">
  <link rel="stylesheet" href="../../css/style.css?v=60">
  <script src="../../js/pinyin.js?v=2" defer></script>
  <script src="../vocabulary-page-shell.js?v=4" defer></script>
  <script src="../vocabulary-list-ui.js?v=3" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../../js/user-word-state.js?v=3" defer></script>
  <script src="../known-words-export.js?v=1" defer></script>
  <script src="../vocabulary-lists.js?v=56" defer></script>
</head>
<body class="dictionary-page vocabulary-list-page" data-page="hsk"
      data-root-href="../../"
      data-profile-image="../../images/profile.jpg"
      data-source="../../data/hsk.json?v=6"
      data-word-mapping-source="../../data/word_mapping.csv?v=1"
      data-cedict-source="../../data/cedict.json?v=4"
      data-supabase-url="https://ipavwfvtxrqipmedsbjf.supabase.co"
      data-supabase-key="sb_publishable_d0CsN33Th0l4qs0_hWa5bA__YggSPaz">
  <div class="vocabulary-sticky">
    <div id="vocabulary-page-header"></div>
    <section class="vocabulary-filters hsk-filters" aria-label="Vocabulary filters">
      <div class="level-filters" id="level-filter" role="group" aria-label="按 HSK 级别筛选">
        <button class="hsk-level hsk1" type="button" data-level="1" aria-pressed="false">HSK1</button>
        <button class="hsk-level hsk2" type="button" data-level="2" aria-pressed="false">HSK2</button>
        <button class="hsk-level hsk3" type="button" data-level="3" aria-pressed="false">HSK3</button>
        <button class="hsk-level hsk4" type="button" data-level="4" aria-pressed="false">HSK4</button>
        <button class="hsk-level hsk5" type="button" data-level="5" aria-pressed="false">HSK5</button>
        <button class="hsk-level hsk6" type="button" data-level="6" aria-pressed="false">HSK6</button>
        <button class="hsk-level hsk7-9" type="button" data-level="7-9" aria-pressed="false">HSK7-9</button>
      </div>
      <div class="filter-options">
        <label class="check-control">
          <input id="pinyin-toggle" type="checkbox">
          <span>显示拼音</span>
        </label>
        <label class="check-control">
          <input id="unknown-filter" type="checkbox" checked>
          <span>只显示不认识</span>
        </label>
        <label class="check-control">
          <input id="known-filter" type="checkbox">
          <span>只显示认识</span>
        </label>
        <label class="check-control">
          <input id="saved-filter" type="checkbox">
          <span>只显示已收藏</span>
        </label>
      </div>
    </section>
    <div id="status" class="list-status" role="status" aria-live="polite">Loading vocabulary…</div>
    <div id="list-pagination" class="list-status" aria-label="Pagination"></div>
  </div>
  <div id="vocabulary-page-account"></div>
  <main id="hsk-list-view">
    <div id="vocabulary-entries" aria-live="polite"></div>
  </main>
  <section id="hsk-progress-view" class="hsk-progress-view" aria-label="HSK 学习进度" hidden>
    <table class="hsk-progress-table">
      <thead>
        <tr><th scope="col">级别</th><th scope="col">进度</th></tr>
      </thead>
      <tbody id="hsk-progress-rows"></tbody>
    </table>
  </section>
  <section id="hsk-music-view" class="hsk-music-view" aria-label="歌词识词" hidden>
    <h2>音乐</h2>
    <p>粘贴歌词或中文文本，点击“确定”后，不认识的 HSK 词语会按级别标色。</p>
    <div id="music-editor">
      <label class="music-input-label" for="music-text">歌词或中文文本</label>
      <textarea id="music-text" rows="8" placeholder="在此粘贴歌词或中文文本……"></textarea>
      <button id="music-analyze" class="sentence-button" type="button" disabled>确定</button>
    </div>
    <button id="music-redo" class="sentence-button" type="button" hidden>重新输入</button>
    <div id="music-status" class="music-status" role="status" aria-live="polite">正在加载 HSK 词表…</div>
    <div id="music-results" class="music-results"></div>
  </section>
</body>
</html>
