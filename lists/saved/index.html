<!doctype html>
<html lang="en" class="dictionary-document">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="../../css/style.css?v=60">
  <script src="../../js/pinyin.js?v=2" defer></script>
  <script src="../vocabulary-page-shell.js?v=4" defer></script>
  <script src="../vocabulary-list-ui.js?v=3" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../../js/user-word-state.js?v=3" defer></script>

<body class="dictionary-page vocabulary-list-page saved-words-page" data-page="saved"
      data-root-href="../../"
      data-profile-image="../../images/profile.jpg"
      data-word-mapping-source="../../data/word_mapping.csv?v=1"
      data-hsk-source="../../data/hsk.json?v=6"
      data-frequency-source="../../data/frequency.json?v=4"
      data-zimu-source="../../data/zimu.json?v=2"
      data-supabase-url="https://ipavwfvtxrqipmedsbjf.supabase.co"
      data-supabase-key="sb_publishable_d0CsN33Th0l4qs0_hWa5bA__YggSPaz">
  <div class="vocabulary-sticky saved-words-sticky">
    <div id="vocabulary-page-header"></div>
    <section class="vocabulary-filters frequency-filters" aria-label="Saved word filters">
      <div class="filter-options">
        <label class="check-control">
          <input id="pinyin-toggle" type="checkbox">
          <span>显示拼音</span>
        </label>
        <label class="hsk-membership-filter">
          <span>认识</span>
          <select id="known-status-filter">
            <option value="all" selected>显示全部</option>
            <option value="unknown">只显示不认识</option>
            <option value="known">只显示认识</option>
          </select>
        </label>
        <label class="hsk-membership-filter">
          <span>HSK</span>
          <select id="hsk-membership-filter">
            <option value="all">显示全部</option>
            <option value="only">仅显示 HSK</option>
            <option value="hide">隐藏 HSK</option>
          </select>
        </label>
      </div>
    </section>
    <div id="status" class="list-status" role="status" aria-live="polite">Checking your account…</div>
    <div id="ranked-list-search-container" class="ranked-list-search">
      <label class="visually-hidden" for="ranked-list-search">Filter saved words</label>
      <div class="search-wrapper">
        <button id="ranked-list-search-clear" class="clear-btn" type="button"
                aria-label="Clear list filter">→</button>
        <input id="ranked-list-search" type="text" autocomplete="off"
               placeholder="在此输入……">
      </div>
    </div>
    <div id="list-pagination" class="list-status" aria-label="Pagination"></div>
  </div>
  <div id="vocabulary-page-account"></div>
  <main id="saved-words" aria-live="polite"></main>
</body>
</html>
